<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Biscuit</title>
<meta name="description" content="Fantasy Biscuit — home of the biscuit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF1DE;
    --cream-deep: #F3E4C4;
    --biscuit: #DFA25D;
    --biscuit-dark: #B97A3E;
    --biscuit-shadow: #8A5A2C;
    --choc: #6B3A22;
    --ink: #5C3A1E;
    --gold: #E7B04E;
    --storm-dark: #4A5568;
    --storm-mid: #7B8CA0;
    --storm-light: #B8C4D0;
    --sky-deep: #6E7F8D;
    --sky-light: #C9D6DC;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; min-height: 100%; }

  body {
    display: flex;
    align-items: stretch;
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
  }

  /* ---- Sidebar navigation ---- */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--cream-deep);
    border-right: 1px solid rgba(138, 90, 44, 0.15);
    padding: 2rem 1.4rem;
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  .brand {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--ink);
    text-decoration: none;
    line-height: 1.2;
  }

  .nav-links {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: .35rem;
  }

  .nav-links a {
    display: block;
    padding: .6rem .8rem;
    border-radius: 10px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 500;
    font-size: .98rem;
    color: var(--ink);
    text-decoration: none;
    transition: background .15s ease;
  }
  .nav-links a:hover { background: rgba(138, 90, 44, 0.1); }
  .nav-links a[aria-current="page"] {
    background: var(--biscuit);
    color: #FFFDF7;
  }

  .hamburger {
    display: none;
    position: fixed;
    top: 1rem;
    left: 1rem;
    z-index: 20;
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 10px;
    background: var(--cream-deep);
    box-shadow: 0 2px 8px rgba(92, 58, 30, 0.15);
    cursor: pointer;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
  }
  .hamburger span {
    display: block;
    width: 20px;
    height: 2px;
    background: var(--ink);
    border-radius: 1px;
  }

  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    z-index: 15;
  }

  @media (max-width: 768px) {
    .hamburger { display: flex; }
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      transform: translateX(-100%);
      transition: transform .25s ease;
      z-index: 18;
      box-shadow: 4px 0 16px rgba(0,0,0,0.15);
    }
    body.nav-open .sidebar { transform: translateX(0); }
    body.nav-open .sidebar-overlay { display: block; }
  }

  .main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 2rem;
    padding: 3rem 1.5rem;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 30%, var(--cream-deep), var(--cream) 70%);
  }

  .stage {
    position: relative;
    width: min(70vw, 60vh, 480px);
    aspect-ratio: 1 / 1;
  }

  .biscuit-btn {
    all: unset;
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transition: transform .15s ease;
  }
  .biscuit-btn:hover { transform: scale(1.03); }
  .biscuit-btn:active { transform: scale(0.98); }
  .biscuit-btn:focus-visible .biscuit-photo {
    outline: 3px solid var(--biscuit-shadow);
    outline-offset: 6px;
  }

  .biscuit-photo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 10px 16px rgba(92, 58, 30, 0.3));
    animation: settle 1.1s cubic-bezier(.2,.9,.25,1) both;
  }

  @keyframes settle {
    from { transform: translateY(14px) scale(.94); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }

  .bubble {
    position: absolute;
    top: 2%;
    right: -4%;
    background: #FFFFFF;
    color: var(--ink);
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(.75rem, 1.7vw, .95rem);
    line-height: 1.25;
    padding: .55rem .85rem;
    border-radius: 16px 16px 16px 4px;
    box-shadow: 0 6px 16px rgba(92, 58, 30, 0.25);
    max-width: 46%;
    text-align: center;
    animation: bob 2.4s ease-in-out infinite;
    z-index: 2;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  h1 {
    margin: 0;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    color: var(--ink);
    letter-spacing: .01em;
  }

  .scores {
    width: min(88vw, 480px);
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height .35s ease, opacity .3s ease, margin .35s ease;
  }
  .scores.open {
    max-height: 60vh;
    opacity: 1;
    overflow-y: auto;
  }

  .scores-card {
    background: #FFFDF7;
    border: 1px solid var(--cream-deep);
    border-radius: 14px;
    padding: 1.1rem 1.3rem;
    box-shadow: 0 6px 20px rgba(92, 58, 30, 0.1);
  }

  .scores-card h2 {
    margin: 0 0 .7rem;
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.05rem;
    color: var(--ink);
  }

  .date-row {
    display: flex;
    align-items: center;
    gap: .6rem;
    margin-bottom: .9rem;
  }

  .date-row label {
    font-family: 'Baloo 2', sans-serif;
    font-size: .9rem;
    color: var(--biscuit-shadow);
  }

  .date-row input[type="date"] {
    font-family: 'Inter', sans-serif;
    font-size: .92rem;
    color: var(--ink);
    background: var(--cream);
    border: 1px solid var(--cream-deep);
    border-radius: 8px;
    padding: .4rem .6rem;
    cursor: pointer;
  }
  .date-row input[type="date"]:focus-visible {
    outline: 2px solid var(--biscuit-shadow);
    outline-offset: 2px;
  }

  .game-row {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    padding: .5rem 0;
    border-top: 1px solid var(--cream-deep);
    font-size: .92rem;
    color: var(--ink);
  }
  .game-row:first-of-type { border-top: none; }

  .game-row .status {
    color: var(--biscuit-dark);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .scores-note {
    font-size: .85rem;
    color: var(--biscuit-shadow);
    margin: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .biscuit-photo, .bubble { animation: none; }
  }
</style>
</head>

  <h1>Fantasy Biscuit</h1>

  <div class="scores" id="scores">
    <div class="scores-card">
      <h2 id="scoresHeading">Box scores</h2>
      <div class="date-row">
        <label for="scoreDate">Date</label>
        <input type="date" id="scoreDate">
      </div>
      <div id="scoresBody">
        <p class="scores-note">Loading box scores…</p>
      </div>
    </div>
  </div>

  <script>
    const btn = document.getElementById('biscuitBtn');
    const panel = document.getElementById('scores');
    const heading = document.getElementById('scoresHeading');
    const body = document.getElementById('scoresBody');
    const dateInput = document.getElementById('scoreDate');
    let loaded = false;

    function todayISO() {
      return new Date().toISOString().slice(0, 10);
    }

    function yesterdayISO() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return d.toISOString().slice(0, 10);
    }

    dateInput.max = todayISO();
    dateInput.value = yesterdayISO();

    function formatDateLabel(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString(undefined, {
        weekday: 'long', month: 'long', day: 'numeric'
      });
    }

    async function loadScores(dateISO) {
      heading.textContent = `MLB Box Scores — ${formatDateLabel(dateISO)}`;
      body.innerHTML = '<p class="scores-note">Loading box scores…</p>';
      try {
        const res = await fetch(
          `https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${dateISO}&hydrate=linescore`
        );
        if (!res.ok) throw new Error('Request failed');
        const data = await res.json();
        const games = (data.dates && data.dates[0] && data.dates[0].games) || [];

        if (games.length === 0) {
          body.innerHTML = '<p class="scores-note">No MLB games were played that day.</p>';
          return;
        }

        body.innerHTML = games.map(g => {
          const away = g.teams.away, home = g.teams.home;
          const played = g.status && g.status.abstractGameState === 'Final';
          const line = played
            ? `${away.score}–${home.score}`
            : (g.status ? g.status.detailedState : '');
          return `<div class="game-row">
            <span>${away.team.name} @ ${home.team.name}</span>
            <span class="status">${line}</span>
          </div>`;
        }).join('');
      } catch (err) {
        body.innerHTML = '<p class="scores-note">Couldn\'t load box scores right now — try again in a bit.</p>';
      }
    }

    btn.addEventListener('click', () => {
      const isOpen = panel.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(isOpen));
      if (isOpen && !loaded) {
        loaded = true;
        loadScores(dateInput.value);
      }
    });

    dateInput.addEventListener('change', () => {
      if (!dateInput.value) return;
      loaded = true;
      loadScores(dateInput.value);
    });

    const navToggle = document.getElementById('navToggle');
    const navOverlay = document.getElementById('navOverlay');
    function closeNav() {
      document.body.classList.remove('nav-open');
      navToggle.setAttribute('aria-expanded', 'false');
    }
    navToggle.addEventListener('click', () => {
      const isOpen = document.body.classList.toggle('nav-open');
      navToggle.setAttribute('aria-expanded', String(isOpen));
    });
    navOverlay.addEventListener('click', closeNav);
  </script>

</main>
</body>
</html>
